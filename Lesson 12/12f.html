<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 12f</title>
        <style>
            div{
                font-family: Arial;
            }
            .container{
                display: flex;
                flex-direction: row;
                background-color: rgb(171, 106, 209);
                height: 60px;
                align-items: center;
                justify-content: space-between;
                padding-left: 15px;
                padding-right: 15px;
            }
            .left-side{
                font-weight: bold;
                color: white;
            }
            .search-bar{
                width: 500px;
                border: none;
                margin-top: 12px;
                margin-bottom: 12px;
                height: 30px;
                border-radius: 15px;
                padding-left: 20px;
            }
            button{
                background-color:  rgb(171, 106, 209);
                border-color: white;
                border-style: solid;
                border-width: 1px;
                border-radius: 2px;
                color:white;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 16px;
                padding-right: 16px;   
                        }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="left-side">Home</div>
                <input class="search-bar" type="text"
                    placeholder="Search">
                <button>Download</button>
        </div>
    </body>
</html>
