<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 12e</title>
        <style>
            div{
                font-family: Arial;
            }
            .container{
                width: 300px;
                border-color: gray;
                border-style: solid;
                border-width: 2px;
            }
            .flexbox{
                display: flex;
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                padding-top: 8px;
                padding-bottom: 8px;
                padding-left: 14px;
                padding-right: 14px;
            }
            .notifications{
                font-weight: bold;
                background-color: rgb(49, 109, 245);
                padding-bottom: 9px;
                padding-top: 9px;
                padding-left: 15px;
                padding-right: 15px;
                border: none;
                border-radius: 30px;
                color: white;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="flexbox">
                <div>Home</div>
                <div class="notifications">14</div>
            </div>
            <div class="flexbox">
                <div>Notifications</div>
                <div class="notifications">3</div>
            </div>
            <div class="flexbox">
                <div>Messages</div>
                <div class="notifications">5</div>
            </div>
        </div>
    </body>
</html>
