<!DOCTYPE html>
<html>
    <head>
        <title>Exercise 8c</title>
        <style>
            div{
                text-align: center;
            }
            .image{
                height: 160px;
                object-fit: fill;
            }
            .search{
                padding: 12px;
                width: 600px;
                border-radius: 50px;
                border: none;
                box-shadow: rgba(0, 0, 0, 0.30) 0px 0px 7px;
                overflow: visible;
                font-size: 16px;
                line-height: 1.5;
                box-sizing: border-box; 
            }
            .buttons{
                margin-top: 20px;
            }
            .button{
                font-size: 16px;
                font-family: Arial;
                font-weight: bold;
                padding-top: 15px;
                padding-bottom: 15px;
                padding-left: 25px;
                padding-right: 25px;
                margin-right: 12px;
                border: none;

            }
        </style>
    </head>
    <body>
        <div>
        <img class="image" src="images/google_PNG.png">
         </div>
          <div>
         <input class="search" type="text" placeholder="Search Google or type a URL" >
          </div>
          <div class="buttons">
          <button class="button">Google Search</button>
          <button class="button">I&apos;m Feeling Lucky</button>
          </div>
    </body>
</html>
